<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pick your seats</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <!-- Step 3: pick seats in the widget, then enter contact details -->
    <p><a href="/events/">← All events</a></p>

    <p id="summary">Pick your seats.</p>

    <iframe id="widget" title="Seat selection"></iframe>

    <form id="contact" hidden>
      <h2>Your details</h2>
      <input name="firstName" placeholder="First name" required />
      <input name="lastName" placeholder="Last name" required />
      <input name="emailAddress" type="email" placeholder="Email" required />
      <input
        name="phoneNumber"
        type="tel"
        placeholder="Phone, e.g. +15551234567"
        required
      />
      <input
        name="country"
        placeholder="Country code, e.g. US"
        maxlength="2"
        required
      />
      <button>Confirm booking</button>
    </form>

    <script type="module" src="./event.js"></script>
  </body>
</html>
